# Try it:  casecheck run examples/unit_converter/cases.yaml --no-judge
name: unit converter
target:
  python: agent.py:agent

# Used by `judge:` checks. Remove --no-judge to run them (needs Anthropic credentials).
judge:
  model: claude-opus-5-5
  effort: low

cases:
  - id: km-to-miles
    input: Convert 10 km to miles
    checks:
      - number: { path: value, equals: 6.214, tolerance: 0.01 }
      - json_schema:
          type: object
          required: [value, unit, text]
          properties:
            value: { type: number }
            unit: { enum: [km, mi, kg, lb, C, F] }
            text: { type: string }

  - id: miles-to-km
    input: How far is 26.2 miles in kilometres?
    checks:
      - number: { path: value, equals: 42.165, tolerance: 0.01 }

  - id: kg-to-pounds
    input: Convert 5 kg to pounds
    checks:
      - number: { path: value, equals: 11.023, tolerance: 0.01 }
      - contains: "lb"

  - id: celsius-to-fahrenheit
    input: What is 100 C in F?
    checks:
      - number: { path: value, equals: 212, tolerance: 0.1 }

  - id: fahrenheit-to-celsius
    input: What is 212 F in C?
    checks:
      - number: { path: value, equals: 100, tolerance: 0.1 }

  - id: unknown-unit
    input: Convert 3 parsecs to furlongs
    checks:
      - contains: "can't convert"
      - not_contains: ["error", "traceback"]

  - id: not-a-conversion
    input: What's the weather like?
    checks:
      - regex: "(?i)can't tell what to convert"

  - id: fast-enough
    input: Convert 1 km to miles
    checks:
      - max_latency_ms: 200

  - id: clear-answer
    tags: [judge]
    input: Convert 5 kg to pounds
    checks:
      - judge: >
          The `text` field states the converted amount together with its unit,
          in one short sentence, with no unrelated information.
